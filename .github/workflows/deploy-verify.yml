name: Deploy verify

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to verify'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npx -y @railway/cli@latest status --json > status.json || true
          cat status.json || true
      - name: Smoke
        env:
          APP_URL: ${{ vars.APP_URL }}
          ENVIRONMENT: ${{ inputs.env || 'production' }}
        run: scripts/verify-deploy.sh "$ENVIRONMENT"
